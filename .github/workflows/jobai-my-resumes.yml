name: JobAI My Resumes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-my-resumes:
    # Legacy inline installer is disabled. The maintained manager is loaded
    # from my-resumes-manager.js / my-resumes-manager-v4.js.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add My Resumes module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('home-translation.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* JobAI My Resumes v1 */'
          if marker in s:
              raise SystemExit(0)
          addon = r'''\n\n/* JobAI My Resumes v1 */\n(function(){\n  'use strict';\n  var KEY='jobaiMyResumes';\n  var ACTIVE='jobaiActiveResume';\n  var LANGS={uk:'🇺🇦 Українська',sk:'🇸🇰 Slovenčina',en:'🇬🇧 English',de:'🇩🇪 Deutsch',cs:'🇨🇿 Čeština',pl:'🇵🇱 Polski',hu:'🇭🇺 Magyar'};\n  var FIELD_IDS=['name','position','phone','email','city','profile','skills','languages'];\n  function lang(){var l=(localStorage.getItem('jobaiLanguage')||document.documentElement.lang||'uk').toLowerCase();for(var k in LANGS)if(l.indexOf(k)===0)return k;return 'uk';}\n  function read(){var d={};FIELD_IDS.forEach(function(id){var e=document.getElementById(id);d[id]=e?e.value:'';});d.experiences=Array.isArray(window.experiences)?JSON.parse(JSON.stringify(window.experiences)):[];d.educations=Array.isArray(window.educations)?JSON.parse(JSON.stringify(window.educations)):[];d.photo=localStorage.getItem('jobaiPhoto')||'';['jobaiResumeTemplate','jobaiResumeColor','jobaiResumeFont','jobaiResumeFontSize','jobaiResumeNameSize','jobaiResumeFontWeight','jobaiResumeLineHeight'].forEach(function(k){d[k]=localStorage.getItem(k)||'';});return d;}\n  function all(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')||[];}catch(e){return [];}}\n  function put(a){localStorage.setItem(KEY,JSON.stringify(a));}\n  function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\\"/g,'&quot;').replace(/'/g,'&#039;');}\n  function fire(e){try{e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));}catch(x){}}\n  function restore(d){if(!d)return;FIELD_IDS.forEach(function(id){var e=document.getElementById(id);if(e)e.value=d[id]||'';});window.experiences=Array.isArray(d.experiences)?JSON.parse(JSON.stringify(d.experiences)):[];window.educations=Array.isArray(d.educations)?JSON.parse(JSON.stringify(d.educations)):[];if(d.photo)localStorage.setItem('jobaiPhoto',d.photo);else localStorage.removeItem('jobaiPhoto');['jobaiResumeTemplate','jobaiResumeColor','jobaiResumeFont','jobaiResumeFontSize','jobaiResumeNameSize','jobaiResumeFontWeight','jobaiResumeLineHeight'].forEach(function(k){if(d[k])localStorage.setItem(k,d[k]);});try{if(typeof renderExperiences==='function')renderExperiences();if(typeof renderEducations==='function')renderEducations();if(typeof displayResumePhoto==='function')displayResumePhoto();if(typeof updateResumePreview==='function')updateResumePreview();if(typeof applyFontSettings==='function')applyFontSettings();}catch(e){}FIELD_IDS.forEach(function(id){var e=document.getElementById(id);if(e)fire(e);});}\n  function save(id,name){var a=all(),i=a.findIndex(function(x){return x.id===id}),now=new Date().toISOString(),item={id:id||('cv_'+Date.now()),name:name||'Моє резюме',language:lang(),updatedAt:now,data:read()};if(i<0)a.unshift(item);else{item.name=a[i].name;item.language=a[i].language||lang();a[i]=Object.assign({},a[i],item);}put(a);localStorage.setItem(ACTIVE,item.id);render();return item;}\n  function formatDate(s){try{return new Date(s).toLocaleString();}catch(e){return '';}}\n  function render(){var box=document.getElementById('jobaiMyResumes');if(!box)return;var a=all(),t=lang(),title=t==='sk'?'Moje životopisy':t==='en'?'My resumes':'Мої резюме';var html='<div style="font-weight:800;font-size:20px;margin-bottom:12px">📁 '+title+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button type="button" id="jobaiNewResume" style="padding:9px 13px;border:0;border-radius:9px;cursor:pointer;font-weight:700">＋ '+(t==='sk'?'Nové':t==='en'?'New':'Нове')+'</button><button type="button" id="jobaiSaveCurrent" style="padding:9px 13px;border:0;border-radius:9px;cursor:pointer;font-weight:700">💾 '+(t==='sk'?'Uložiť aktuálne':t==='en'?'Save current':'Зберегти поточне')+'</button></div>';if(!a.length)html+='<div style="opacity:.7">'+(t==='sk'?'Zatiaľ nemáte uložené žiadne životopisy.':t==='en'?'You have no saved resumes yet.':'У вас ще немає збережених резюме.')+'</div>';a.forEach(function(x){var active=localStorage.getItem(ACTIVE)===x.id;html+='<div data-resume-id="'+esc(x.id)+'" style="padding:13px;margin:9px 0;border:1px solid rgba(127,127,127,.25);border-radius:12px;background:'+(active?'rgba(127,127,127,.10)':'transparent')+'"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><div style="font-weight:800">'+(active?'● ':'')+esc(x.name)+'</div><div style="font-size:12px;opacity:.7">'+(LANGS[x.language]||x.language||'')+' · '+formatDate(x.updatedAt)+'</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" data-load="'+esc(x.id)+'">'+(t==='sk'?'Načítať':t==='en'?'Load':'Завантажити')+'</button><button type="button" data-dup="'+esc(x.id)+'">'+(t==='sk'?'Duplikovať':t==='en'?'Duplicate':'Дублювати')+'</button><button type="button" data-rename="'+esc(x.id)+'">'+(t==='sk'?'Premenovať':t==='en'?'Rename':'Перейменувати')+'</button><button type="button" data-pdf="'+esc(x.id)+'">PDF</button><button type="button" data-del="'+esc(x.id)+'">'+(t==='sk'?'Zmazať':t==='en'?'Delete':'Видалити')+'</button></div></div></div>';});box.innerHTML=html;bind();}\n  function bind(){var box=document.getElementById('jobaiMyResumes');if(!box)return;box.querySelector('#jobaiNewResume').onclick=function(){var n=prompt(lang()==='sk'?'Názov nového životopisu:':lang()==='en'?'New resume name:':'Назва нового резюме:','Моє резюме');if(!n)return;var item=save(null,n);restore({});localStorage.setItem(ACTIVE,item.id);render();};box.querySelector('#jobaiSaveCurrent').onclick=function(){var id=localStorage.getItem(ACTIVE),a=all(),old=a.find(function(x){return x.id===id;});if(old)save(id,old.name);else{var n=prompt(lang()==='sk'?'Názov životopisu:':lang()==='en'?'Resume name:':'Назва резюме:','Моє резюме');if(n)save(null,n);}render();};box.querySelectorAll('[data-load]').forEach(function(b){b.onclick=function(){var x=all().find(function(z){return z.id===b.dataset.load;});if(x){restore(x.data);localStorage.setItem(ACTIVE,x.id);render();}}});box.querySelectorAll('[data-dup]').forEach(function(b){b.onclick=function(){var x=all().find(function(z){return z.id===b.dataset.dup;});if(!x)return;var n=prompt(lang()==='sk'?'Názov kópie:':lang()==='en'?'Copy name:':'Назва копії:',x.name+' — копія');if(!n)return;var a=all();var y=JSON.parse(JSON.stringify(x));y.id='cv_'+Date.now();y.name=n;y.updatedAt=new Date().toISOString();a.unshift(y);put(a);localStorage.setItem(ACTIVE,y.id);render();}});box.querySelectorAll('[data-rename]').forEach(function(b){b.onclick=function(){var a=all(),x=a.find(function(z){return z.id===b.dataset.rename;});if(!x)return;var n=prompt(lang()==='sk'?'Nový názov:':lang()==='en'?'New name:':'Нова назва:',x.name);if(n){x.name=n;x.updatedAt=new Date().toISOString();put(a);render();}}});box.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var a=all(),x=a.find(function(z){return z.id===b.dataset.del;});if(!x)return;if(!confirm(lang()==='sk'?'Zmazať tento životopis?':lang()==='en'?'Delete this resume?':'Видалити це резюме?'))return;put(a.filter(function(z){return z.id!==x.id;}));if(localStorage.getItem(ACTIVE)===x.id)localStorage.removeItem(ACTIVE);render();}});box.querySelectorAll('[data-pdf]').forEach(function(b){b.onclick=function(){var x=all().find(function(z){return z.id===b.dataset.pdf;});if(x){restore(x.data);localStorage.setItem(ACTIVE,x.id);setTimeout(function(){window.print();},150);}}});}\n  function mount(){if(document.getElementById('jobaiMyResumes')){render();return;}var anchor=document.getElementById('jobaiResumeTranslator')||document.querySelector('#resumePreview')||document.querySelector('.preview-wrapper')||document.querySelector('.card');if(!anchor||!anchor.parentNode)return;var box=document.createElement('div');box.id='jobaiMyResumes';box.className='card';box.style.cssText='margin:18px 0;padding:16px;border-radius:14px;border:1px solid rgba(127,127,127,.25)';anchor.parentNode.insertBefore(box,anchor);render();}\n  var timer;function autosave(){clearTimeout(timer);timer=setTimeout(function(){var id=localStorage.getItem(ACTIVE);if(id){var a=all(),x=a.find(function(z){return z.id===id;});if(x){x.data=read();x.updatedAt=new Date().toISOString();put(a);render();}}},1200);}\n  document.addEventListener('input',function(e){if(e.target&&e.target.closest&&e.target.closest('#jobaiMyResumes'))return;autosave();});\n  function init(){setTimeout(mount,900);setTimeout(mount,2200);}\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n'''
          p.write_text(s + addon, encoding='utf-8')
          PY
      - name: Commit module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-translation.js
          git commit -m "Install My Resumes module [jobai-my-resumes-installed]"
          git push
