name: One-time recommendations v7 loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-load-recs-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load recommendations v7
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('analysis-enhancer-v2.js')
          s=p.read_text(encoding='utf-8')
          old="job-recommendations.js?v=6"
          new="job-recommendations-v7.js?v=1"
          if old not in s:
              raise SystemExit('Expected recommendations v6 loader not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='analysis-enhancer-v2.js?v=4'
          new='analysis-enhancer-v2.js?v=5'
          if old not in s:
              raise SystemExit('Expected analysis enhancer v4 cache key not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate loader
        run: |
          node --check job-recommendations-v7.js
          node --check analysis-enhancer-v2.js
          grep -q 'job-recommendations-v7.js?v=1' analysis-enhancer-v2.js
          grep -q 'analysis-enhancer-v2.js?v=5' index.html
      - name: Commit loader update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-enhancer-v2.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load structured vacancy recommendations v7"
          git push
