name: JobAI Resume compatibility fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[jobai-resume-compat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh resume compatibility scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('resume-compat-fix.js?v=1','resume-compat-fix.js?v=2')
          s=s.replace('resume-sections-toggle.js?v=1','resume-sections-toggle.js?v=4')
          s=s.replace('resume-sections-toggle.js?v=2','resume-sections-toggle.js?v=4')
          s=s.replace('resume-sections-toggle.js?v=3','resume-sections-toggle.js?v=4')
          tag='<script src="resume-empty-sections.js?v=1"></script>'
          if 'resume-empty-sections.js' not in s:
              marker='<script src="resume-sections-toggle.js?v=4"></script>'
              s=s.replace(marker, marker+'\n'+tag)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh resume scripts [jobai-resume-compat]"
          git push
