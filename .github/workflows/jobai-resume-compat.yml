name: JobAI Resume compatibility fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[jobai-resume-compat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh resume compatibility scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('resume-compat-fix.js?v=1','resume-compat-fix.js?v=2')
          s=s.replace('resume-sections-toggle.js?v=1','resume-sections-toggle.js?v=4')
          s=s.replace('resume-sections-toggle.js?v=2','resume-sections-toggle.js?v=4')
          s=s.replace('resume-sections-toggle.js?v=3','resume-sections-toggle.js?v=4')
          tag='<script src="resume-empty-sections.js?v=1"></script>'
          if 'resume-empty-sections.js' not in s:
              marker='<script src="resume-sections-toggle.js?v=4"></script>'
              s=s.replace(marker, marker+'\n'+tag)
          inline_marker='id="jobaiPreviewTemplateNames"'
          if inline_marker not in s:
              inline='<script id="jobaiPreviewTemplateNames">(function(){\n  function fix(){\n    var names={modern:\'Modern\',professional:\'Profi\',executive:\'Classic\',creative:\'Tech\',ats:\'Compact\'};\n    document.querySelectorAll(\'[data-preview-template]\').forEach(function(btn){\n      var key=btn.getAttribute(\'data-preview-template\');\n      if(names[key] && btn.textContent.trim()!==names[key])btn.textContent=names[key];\n    });\n  }\n  fix();\n  if(window.MutationObserver){\n    new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true,characterData:true});\n  }\n  setInterval(fix,1000);\n})();</script>'
              s=s.replace('</body>',inline+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force preview template names in English [jobai-resume-compat]"
          git push
