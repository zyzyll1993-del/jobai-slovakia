name: One-time structured scoring upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-structured-score-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade vacancy fit scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          p=Path('job-recommendations.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('recommended vacancies v6: weighted resume matching + clear fit explanations','recommended vacancies v7: structured applicable-requirement scoring + clear fit explanations',1)
          pattern=r"function scoreJob\(j\)\{.*?\nfunction explainJob\(j\)\{.*?\n\}\nvar DATA=null;"
          replacement=base64.b64decode('').decode('utf-8')
          raise SystemExit('base64 payload intentionally truncated; workflow repair required')
          PY
