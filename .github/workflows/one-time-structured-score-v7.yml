name: One-time structured scoring upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-structured-score-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade vacancy fit scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('job-recommendations.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('recommended vacancies v6: weighted resume matching + clear fit explanations','recommended vacancies v7: structured applicable-requirement scoring + clear fit explanations',1)

          pattern=r"function scoreJob\(j\)\{.*?\nfunction explainJob\(j\)\{.*?\n\}\nvar DATA=null;"
          replacement=r'''function smartText(s){
  var n=' '+norm(s)+' ';
  var reps=[
    [/\bчпу\b/g,' cnc '],[/\bcnc\b/g,' cnc '],[/\bоператор\s+чпу\b/g,' cnc operator '],[/\bcnc\s+operator\b/g,' cnc operator '],[/\bcnc\s+operat(?:or|ér|er)\b/g,' cnc operator '],
    [/\bскладник\b/g,' skladnik '],[/\bсклад\b/g,' sklad '],[/\bwarehouse\b/g,' sklad '],[/\bskladnik\b/g,' skladnik '],
    [/\bводій\b/g,' vodic '],[/\bdriver\b/g,' vodic '],[/\bvodic\b/g,' vodic '],
    [/\bзварювальник\b/g,' zvarac '],[/\bwelder\b/g,' zvarac '],[/\bzvarac\b/g,' zvarac '],
    [/\bелектрик\b/g,' elektrikar '],[/\belectrician\b/g,' elektrikar '],[/\belektrikar\b/g,' elektrikar '],
    [/\bмеханік\b/g,' mechanik '],[/\bmechanic\b/g,' mechanik '],
    [/\bпрограміст\b/g,' programator '],[/\bprogrammer\b/g,' programator '],[/\bdeveloper\b/g,' programator '],
    [/\bметролог\b/g,' metrolog '],[/\bmetrologist\b/g,' metrolog '],
    [/\bвиробництв\w*\b/g,' vyroba '],[/\bproduction\b/g,' vyroba '],[/\bvyrob\w*\b/g,' vyroba ']
  ];
  reps.forEach(function(r){n=n.replace(r[0],r[1]);});
  return n.replace(/\s+/g,' ').trim();
}
function smartOverlap(required,have){return overlap(smartText(required),smartText(have));}
function languageCode(s){var n=norm(s);if(/sloven|slovak|словац/.test(n))return 'sk';if(/anglic|english|англ/.test(n))return 'en';if(/nemc|german|німец/.test(n))return 'de';if(/ukrajin|ukrain|україн/.test(n))return 'uk';if(/cestin|cesk|czech|чеськ/.test(n))return 'cs';if(/polst|polish|польськ/.test(n))return 'pl';if(/madar|hungar|угорськ/.test(n))return 'hu';return n;}
function requiredLanguages(j){var a=arr(j.languages).slice();if(norm(j.slovakRequired)==='ano'&&!a.some(function(x){return languageCode(x)==='sk';}))a.push('Slovenčina');return a;}
function languageScore(j){var req=requiredLanguages(j);if(!req.length)return null;var have=(val('languages')+' '+cvText()).split(/[,;\n]+/).map(languageCode);var hits=req.filter(function(x){return have.indexOf(languageCode(x))>=0;}).length;return Math.round(hits/req.length*100);}
function parseExperienceMonths(s){var n=norm(s);if(!n)return null;if(/bez poziadavky|bez praxe|bez odbornej praxe|no experience|без досвід/.test(n))return 0;var m=n.match(/(\d+(?:[.,]\d+)?)\s*(rok|roky|rokov|year|years|рік|роки|років)/);if(m)return Math.round(parseFloat(m[1].replace(',','.'))*12);m=n.match(/(\d+(?:[.,]\d+)?)\s*(mesiac|mesiace|mesiacov|month|months|місяц)/);if(m)return Math.round(parseFloat(m[1].replace(',','.')));return null;}
function dateMonth(v){var n=String(v||'').trim();if(!n)return null;if(/teraz|sucas|present|current|дотепер|тепер/i.test(n)){var d=new Date();return d.getFullYear()*12+d.getMonth();}var m=n.match(/^(\d{1,2})[./-](\d{4})$/);if(m)return Number(m[2])*12+Number(m[1])-1;m=n.match(/^(\d{4})[./-](\d{1,2})$/);if(m)return Number(m[1])*12+Number(m[2])-1;m=n.match(/^(\d{4})$/);if(m)return Number(m[1])*12;return null;}
function resumeExperienceMonths(){var total=0,known=0,now=new Date().getFullYear()*12+new Date().getMonth();arr(window.experiences).forEach(function(x){var a=dateMonth(x&&x.start),b=dateMonth(x&&x.end);if(a!=null){if(b==null)b=now;if(b>=a){total+=b-a+1;known++;}}});return known?Math.min(total,600):null;}
function experienceScore(j){var req=parseExperienceMonths(j.experience);if(req===null)return null;if(req===0)return 100;var have=resumeExperienceMonths();if(have===null)return 20;return Math.max(0,Math.min(100,Math.round(have/req*100)));}
function educationText(){return arr(window.educations).map(function(x){return [x&&x.school,x&&x.speciality,x&&x.specialty,x&&x.year].filter(Boolean).join(' ');}).join(' ');}
function educationScore(j){var req=arr(j.education);if(!req.length)return null;var have=educationText();if(!norm(have))return 20;var best=0;req.forEach(function(x){var s=smartOverlap(x,have);if(s!=null&&s>best)best=s;});return best>=45?100:70;}
function licenceScore(j){var req=arr(j.drivingLicenses);if(!req.length)return null;var have=norm(cvText()).replace(/\s+/g,' ');var hits=req.filter(function(x){var q=norm(x).replace(/[^a-z0-9+]/g,'');if(!q)return false;if(q==='b')return /vodic|vodič|driver|preukaz|license|licence|категор/.test(have)&&/(^|\s)b($|\s|,|;)/.test(' '+have+' ');return have.indexOf(q)>=0;}).length;return Math.round(hits/req.length*100);}
function skillScore(j){var req=arr(j.computerSkills);if(!req.length)return null;var hits=matchedItems(req,val('skills')+' '+cvText()).length;return Math.round(hits/req.length*100);}
function roleScore(j){var desired=val('position');if(!norm(desired))return null;var s=smartOverlap([j.title,j.category].join(' '),desired);return s==null?0:s;}
function structuredScore(j){
  var parts=[];
  function add(name,score,weight){if(score!==null&&score!==undefined)parts.push({name:name,score:score,weight:weight});}
  add('role',roleScore(j),30);add('skills',skillScore(j),30);add('languages',languageScore(j),15);add('experience',experienceScore(j),10);add('education',educationScore(j),10);add('licence',licenceScore(j),5);
  var resumeHasData=norm(cvText()).length>3;
  if(!parts.length)return {score:resumeHasData?35:10,parts:[]};
  var weight=parts.reduce(function(a,p){return a+p.weight;},0);
  var score=Math.round(parts.reduce(function(a,p){return a+p.score*p.weight;},0)/weight);
  var city=norm(val('city'));if(city&&(isNationwide(j)||norm(jobGeo(j)).indexOf(city)>=0))score=Math.min(99,score+4);
  return {score:Math.max(5,Math.min(99,score)),parts:parts};
}
function scoreJob(j){return structuredScore(j).score;}
function explainJob(j){
  var tr=T[lang()],cv=cvText(),why=[],gaps=[],details=structuredScore(j);
  var rs=roleScore(j);if(rs!==null&&rs>=40)why.push(tr.similarRole);
  var city=norm(val('city'));if(city&&(isNationwide(j)||norm(jobGeo(j)).indexOf(city)>=0))why.push(tr.locationFit);
  var skillHits=matchedItems(j.computerSkills,val('skills')+' '+cv).slice(0,3);if(skillHits.length)why.push(tr.skillsHit+': '+skillHits.join(', '));
  var skillMiss=missingItems(j.computerSkills,val('skills')+' '+cv).slice(0,3);if(skillMiss.length)gaps.push(tr.skillsNeed+': '+skillMiss.join(', '));
  var languages=requiredLanguages(j),haveLang=(val('languages')+' '+cv).split(/[,;\n]+/).map(languageCode);
  var languageHits=languages.filter(function(x){return haveLang.indexOf(languageCode(x))>=0;}).slice(0,3);if(languageHits.length)why.push(tr.languagesHit+': '+languageHits.join(', '));
  var languageMiss=languages.filter(function(x){return haveLang.indexOf(languageCode(x))<0;}).slice(0,3);if(languageMiss.length)gaps.push(tr.languagesNeed+': '+languageMiss.join(', '));
  var ls=licenceScore(j);if(ls!==null&&ls>=70)why.push(tr.licenseHit+': '+arr(j.drivingLicenses).join(', '));else if(ls!==null&&ls<70)gaps.push(tr.licenseNeed+': '+arr(j.drivingLicenses).join(', '));
  var es=experienceScore(j);if(es!==null&&es>=70&&parseExperienceMonths(j.experience)>0)why.push((lang()==='sk'?'Prax zodpovedá požiadavke':lang()==='en'?'Experience appears to meet the requirement':'Досвід відповідає вимозі')+': '+j.experience);else if(es!==null&&es<70&&parseExperienceMonths(j.experience)>0)gaps.push(tr.experienceNeed+': '+j.experience);
  var ed=educationScore(j);if(ed!==null&&ed>=70)why.push(lang()==='sk'?'Vzdelanie je v životopise uvedené':lang()==='en'?'Education is shown in the resume':'Освіта вказана в резюме');else if(ed!==null&&ed<70)gaps.push(tr.educationNeed+': '+arr(j.education).slice(0,2).join(', '));
  return {why:why.slice(0,4),gaps:gaps.slice(0,4),parts:details.parts};
}
var DATA=null;'''
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected one score/explain block, replaced {n}')
          p.write_text(s2,encoding='utf-8')

          p=Path('analysis-enhancer-v2.js')
          s=p.read_text(encoding='utf-8')
          if "job-recommendations.js?v=6" not in s:
              raise SystemExit('Expected recommendations v6 loader not found')
          p.write_text(s.replace("job-recommendations.js?v=6","job-recommendations.js?v=7",1),encoding='utf-8')
          PY
      - name: Validate upgraded scoring
        run: |
          node --check job-recommendations.js
          node --check analysis-enhancer-v2.js
          grep -q 'recommended vacancies v7' job-recommendations.js
          grep -q 'function structuredScore' job-recommendations.js
          grep -q 'job-recommendations.js?v=7' analysis-enhancer-v2.js
      - name: Commit scoring upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job-recommendations.js analysis-enhancer-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Improve structured vacancy match scoring"
          git push
