name: One-time analyzer cache bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-analysis-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump analyzer cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'analysis-enhancer-v2.js?v=1' not in s:
              raise SystemExit('analysis cache marker not found')
          p.write_text(s.replace('analysis-enhancer-v2.js?v=1','analysis-enhancer-v2.js?v=2'),encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh analyzer cache for lazy vacancies"
          git push
