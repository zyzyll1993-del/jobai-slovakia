name: One-time saved resume section refresh fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-resume-state-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch saved resume section refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('resume-sections-toggle.js')
          s=p.read_text(encoding='utf-8')
          old="function rebuildSections(){setup('experience');setup('education');}"
          new=old+"\n  window.jobAIRebuildResumeSections=rebuildSections;"
          if old not in s:
              raise SystemExit('resume section rebuild marker not found')
          if 'window.jobAIRebuildResumeSections=rebuildSections;' not in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('my-resumes-manager.js')
          s=p.read_text(encoding='utf-8')
          old="SETTINGS.forEach(function(k){if(d[k])localStorage.setItem(k,d[k]);else localStorage.removeItem(k);});try{if(typeof renderExperiences==='function')renderExperiences();if(typeof renderEducations==='function')renderEducations();"
          new="SETTINGS.forEach(function(k){if(d[k])localStorage.setItem(k,d[k]);else localStorage.removeItem(k);});try{if(typeof window.jobAIRebuildResumeSections==='function')window.jobAIRebuildResumeSections();if(typeof renderExperiences==='function')renderExperiences();if(typeof renderEducations==='function')renderEducations();"
          if old not in s:
              raise SystemExit('saved resume restore marker not found')
          s=s.replace(old,new,1)
          old="a.forEach(function(x){var flag=FLAGS[x.language]||'🌐';active=x.id===active;html+="
          new="a.forEach(function(x){var flag=FLAGS[x.language]||'🌐';var isActive=x.id===active;html+="
          if old not in s:
              raise SystemExit('active resume marker not found')
          s=s.replace(old,new,1)
          old="+(active?'● ':'')+flag"
          new="+(isActive?'● ':'')+flag"
          if old not in s:
              raise SystemExit('active resume indicator marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('home-translation.js')
          s=p.read_text(encoding='utf-8')
          old="if(typeof window.renderExperiences==='function')window.renderExperiences();"
          new="if(typeof window.jobAIRebuildResumeSections==='function')window.jobAIRebuildResumeSections();\n    if(typeof window.renderExperiences==='function')window.renderExperiences();"
          if old not in s:
              raise SystemExit('language-version restore marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check resume-sections-toggle.js
          node --check my-resumes-manager.js
          node --check home-translation.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume-sections-toggle.js my-resumes-manager.js home-translation.js
          git diff --cached --quiet && exit 0
          git commit -m "Refresh resume sections when opening saved resumes"
          git push
