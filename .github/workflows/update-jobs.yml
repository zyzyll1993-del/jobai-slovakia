name: Update live jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_jobs.py'
      - 'scripts/run_jobs.py'
      - 'scripts/fix_job_geo.py'
      - 'scripts/finalize_jobs.py'
      - '.github/workflows/update-jobs.yml'

concurrency:
  group: update-live-jobs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch current vacancies
        run: python scripts/run_jobs.py
      - name: Finalize vacancy geography and metadata
        run: python scripts/finalize_jobs.py
      - name: Commit vacancy data safely
        run: |
          set -e
          cp jobs-data.json /tmp/jobs-data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/jobs-data.json jobs-data.json
            git add jobs-data.json

            if git diff --cached --quiet; then
              echo "No vacancy data changes to publish"
              exit 0
            fi

            git commit -m "Update live vacancies [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying ($attempt/3)"
            sleep 3
          done

          echo "Could not publish vacancy data after 3 retries"
          exit 1
