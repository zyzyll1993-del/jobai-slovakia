name: One-time resume section cache bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-section-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump section translation cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('resume-sections-toggle.js?v=7','resume-sections-toggle.js?v=9')
          s=s.replace('resume-sections-toggle.js?v=8','resume-sections-toggle.js?v=9')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh resume section translation cache"
          git push
