name: One-time safe resume tailor v3 enable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-enable-tailor-v3.yml'

permissions:
  contents: write

jobs:
  validate-and-enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts
        run: |
          node --check analysis-enhancer-v3.js
          node --check resume-tailor-v3.js

      - name: Connect structured analysis to safe tailoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('analysis-enhancer-v3.js')
          s=p.read_text(encoding='utf-8')
          marker="function analyze(){var job=text('jobText')||text('job'),result=document.getElementById('analysisResult');if(!result)return;"
          if marker not in s:
              raise SystemExit('analyze marker not found')
          loader="function loadTailor(){if(typeof window.jobAITailorInit==='function'){window.jobAITailorInit();return;}if(window.__jobaiTailorLoading)return;window.__jobaiTailorLoading=true;var old=document.getElementById('jobaiTailorV3Script');if(old)old.remove();var s=document.createElement('script');s.id='jobaiTailorV3Script';s.src='resume-tailor-v3.js?v=1';s.defer=true;s.onload=function(){window.__jobaiTailorLoading=false;if(typeof window.jobAITailorInit==='function')window.jobAITailorInit();};s.onerror=function(){window.__jobaiTailorLoading=false;};document.head.appendChild(s);}\n"
          if 'function loadTailor(){' not in s:
              s=s.replace(marker,loader+marker,1)
          old="var details=build(job);render(details);setTimeout(loadRecommendations,80);"
          new="var details=build(job);window.__jobaiLastAnalysis=details;render(details);setTimeout(loadRecommendations,80);setTimeout(loadTailor,120);"
          if old not in s:
              raise SystemExit('analysis details marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='analysis-enhancer-v3.js?v=2'
          new='analysis-enhancer-v3.js?v=3'
          if old not in s:
              raise SystemExit('analysis v3/v2 cache key not found')
          if s.count(old)!=1:
              raise SystemExit(f'expected one analysis cache key, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate integration
        run: |
          node --check analysis-enhancer-v3.js
          node --check resume-tailor-v3.js
          grep -q 'window.__jobaiLastAnalysis=details' analysis-enhancer-v3.js
          grep -q "resume-tailor-v3.js?v=1" analysis-enhancer-v3.js
          grep -q 'analysis-enhancer-v3.js?v=3' index.html
          grep -q 'Add missing requirements only when they are genuinely true' resume-tailor-v3.js

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-enhancer-v3.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable safe structured resume tailoring v3"
          git push
