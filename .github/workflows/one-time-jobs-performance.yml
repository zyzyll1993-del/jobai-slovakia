name: One-time jobs performance optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-jobs-performance.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize vacancy filtering before scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('jobs-page.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('function draw(){')
          end=s.index('\nfunction load(){', start)
          new_draw="""function draw(){var list=document.getElementById('jpList');if(!list)return;var x=tr(),q=norm(val('jpQ')),loc=norm(val('jpLoc')),region=val('jpRegion'),cat=val('jpCat'),min=parseFloat(val('jpMin'))||0,sort=val('jpSort'),fit=document.getElementById('jpFit').checked,maxKm=parseFloat(val('jpDistance'))||0,from=cityCoord(val('jpFrom'));var jobs=DATA.jobs.map(function(j,i){var geo=jobGeo(j),jc=cityCoord(geo),nationwide=norm(j.region)==='cele slovensko'||norm(j.location)==='cele slovensko';return Object.assign({},j,{_i:i,_pay:sal(j.salary),_region:j.region||regionForLocation(geo),_km:nationwide?null:(from&&jc?km(from,jc):null),_geo:geo,_nationwide:nationwide});}).filter(function(j){var text=norm([j.title,j.employer,j.category,j.searchTerm,j.description].join(' ')),locOk=!loc||j._nationwide||norm(j._geo).indexOf(loc)>=0,regionOk=!region||j._nationwide||j._region===region,distOk=!maxKm||!from||j._nationwide||(j._km!==null&&j._km<=maxKm);return(!q||text.indexOf(q)>=0)&&locOk&&regionOk&&(!cat||j.category===cat)&&(!min||j._pay>=min)&&distOk;}).map(function(j){var d=detailScore(j);j._rel=d.score;j._parts=d.parts;return j;}).filter(function(j){return !fit||j._rel>=60;});jobs.sort(function(a,b){return sort==='pay'?b._pay-a._pay:b._rel-a._rel;});document.getElementById('jpCount').textContent=x.found+': '+jobs.length;list.innerHTML=jobs.length?jobs.slice(0,60).map(function(j){var p=j._parts||{};return '<article class=\"jp-card\"><div class=\"jp-meta\"><span class=\"jp-chip\">'+esc(j.category||'—')+'</span><span class=\"jp-chip\"><b>'+esc(x.matchLabel)+': '+j._rel+'%</b></span>'+(j._km!==null?'<span class=\"jp-chip\">🚗 ~'+j._km+' km</span>':'')+'</div><h3>'+esc(j.title)+'</h3><div class=\"jp-company\">'+esc(j.employer||'')+'</div><div>'+esc(j.location||'')+'</div><div class=\"jp-meta\">'+(j.city?'<span class=\"jp-chip\">📍 '+esc(j.city)+'</span>':j._nationwide?'<span class=\"jp-chip\">📍 '+esc(x.allDistance)+'</span>':'')+(j.salary?'<span class=\"jp-chip\">💶 '+esc(j.salary)+' €</span>':'')+'</div><div class=\"jp-reqs\">'+statusChip(x.skills,p.skills,arr(j.computerSkills).length>0)+statusChip(x.langs,p.langs,arr(j.languages).length>0||norm(j.slovakRequired)==='ano')+statusChip(x.experience,p.experience,!!norm(j.experience))+statusChip(x.education,p.education,arr(j.education).length>0)+statusChip(x.license,p.license,arr(j.drivingLicenses).length>0)+'</div><div class=\"jp-actions\"><button type=\"button\" onclick=\"jobAIAnalyzeVacancy('+j._i+')\">'+x.analyze+'</button><a href=\"'+esc(j.url)+'\" target=\"_blank\" rel=\"noopener\">'+x.open+'</a></div></article>';}).join(''):'<p>'+x.empty+'</p>';var updated=(DATA.updatedAt||'').replace('T',' ').slice(0,16);document.getElementById('jpDate').textContent=updated?x.updated+': '+updated:'';}"""
          s=s[:start]+new_draw+s[end:]
          s=s.replace('standalone vacancies page v6','standalone vacancies page v7')
          p.write_text(s,encoding='utf-8')

          p=Path('analysis-enhancer-v2.js')
          s=p.read_text(encoding='utf-8')
          if "jobs-page.js?v=6" not in s:
              raise SystemExit('jobs launcher cache marker not found')
          p.write_text(s.replace("jobs-page.js?v=6","jobs-page.js?v=7"),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'analysis-enhancer-v2.js?v=2' not in s:
              raise SystemExit('analysis enhancer cache marker not found')
          p.write_text(s.replace('analysis-enhancer-v2.js?v=2','analysis-enhancer-v2.js?v=3'),encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check jobs-page.js
          node --check analysis-enhancer-v2.js
      - name: Commit optimized vacancies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-page.js analysis-enhancer-v2.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize vacancy filtering for Android"
          git push
