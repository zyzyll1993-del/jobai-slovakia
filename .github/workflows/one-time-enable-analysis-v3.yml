name: One-time structured analysis v3 validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-enable-analysis-v3.yml'

permissions:
  contents: write

jobs:
  validate-and-enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check analysis-enhancer-v3.js
          node --check job-recommendations-v7.js

      - name: Runtime smoke test structured analysis
        run: |
          node <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const els={};
          function el(id,value=''){
            return els[id]={id,value,textContent:'',innerHTML:'',style:{},appendChild(){},scrollIntoView(){}};
          }
          const vacancy=[
            'Stavebný klampiar (muž/žena)',
            'Miesto výkonu práce: Rázusova 800/12, 94901 Nitra - Nitra',
            'Mesto: Nitra',
            'Okres: Nitra',
            'Kraj: Nitriansky kraj',
            'Mzda: 920',
            'Náplň práce: Meranie, rezanie, ohýbanie a tvarovanie plechov pomocou ručného náradia.',
            'Požadovaná prax: aspoň 1 rok',
            'Požadované vzdelanie: Nižšie stredné odborné vzdelanie',
            'Slovenčina nevyhnutná: Nie'
          ].join('\n');
          el('jobText',vacancy);
          el('position','Stavebný klampiar');
          el('profile',''); el('skills','meranie, rezanie, ručné náradie'); el('languages','Ukrajinčina'); el('city','Nitra');
          el('analysisResult'); el('score'); el('progressBar'); el('found'); el('missing'); el('recommendation'); el('detectedJobs');
          global.window={experiences:[{company:'Firma',position:'Klampiar',start:'01/2024',end:'09/2026'}],educations:[{school:'Odborná škola',speciality:'strojárstvo',year:'2020'}]};
          global.localStorage={getItem(k){return k==='jobaiLanguage'?'ua':null;}};
          global.document={
            documentElement:{lang:'uk'}, readyState:'loading', head:{appendChild(){}},
            getElementById(id){return els[id]||null;}, addEventListener(){}, querySelector(){return null;},
            createElement(){return {style:{},appendChild(){},set id(v){this._id=v},get id(){return this._id},innerHTML:'',defer:false};}
          };
          vm.runInThisContext(fs.readFileSync('analysis-enhancer-v3.js','utf8'));
          if(typeof window.analyzeJob!=='function') throw new Error('window.analyzeJob missing');
          window.analyzeJob();
          if(!/^\d+%$/.test(els.score.textContent)) throw new Error('score not rendered: '+els.score.textContent);
          if(els.analysisResult.style.display!=='block') throw new Error('result not visible');
          if(!els.recommendation.textContent) throw new Error('recommendation missing');
          if(!els.detectedJobs.innerHTML.includes('Stavebný klampiar')) throw new Error('vacancy title not parsed');
          console.log('structured analysis smoke OK', els.score.textContent);
          NODE

      - name: Enable v3 after successful checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='analysis-enhancer-v2.js?v=6'
          new='analysis-enhancer-v3.js?v=1'
          if old not in s:
              raise SystemExit('Expected analysis enhancer v2/v6 loader not found')
          if s.count(old)!=1:
              raise SystemExit(f'Expected one old loader, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'analysis-enhancer-v3.js?v=1' index.html

      - name: Commit enabled structured analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable structured vacancy analysis v3"
          git push
