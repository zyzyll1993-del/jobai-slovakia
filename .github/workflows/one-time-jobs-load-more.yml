name: One-time vacancies load more

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-jobs-load-more.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add responsive load more to vacancies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('jobs-page.js')
          s=p.read_text(encoding='utf-8')

          if 'standalone vacancies page v7' not in s:
              raise SystemExit('expected jobs-page v7 not found')

          s=s.replace("var DATA={jobs:[]};", "var DATA={jobs:[]};\nvar DISPLAY_STEP=window.innerWidth<=560?20:60,DISPLAY_LIMIT=DISPLAY_STEP;")

          old="<div class=\"jp-count\" id=\"jpCount\"></div><div class=\"jp-grid\" id=\"jpList\"></div><div class=\"jp-date\" id=\"jpDate\"></div>"
          new="<div class=\"jp-count\" id=\"jpCount\"></div><div class=\"jp-grid\" id=\"jpList\"></div><div style=\"text-align:center;margin:16px 0\"><button type=\"button\" id=\"jpMore\" class=\"action-button\" style=\"display:none\"></button></div><div class=\"jp-date\" id=\"jpDate\"></div>"
          if old not in s:
              raise SystemExit('jobs list markup marker not found')
          s=s.replace(old,new)

          marker="['jpRegion','jpCat','jpSort','jpFit','jpDistance'].forEach(function(id){document.getElementById(id).addEventListener('change',draw);});style();translate();"
          repl="['jpRegion','jpCat','jpSort','jpFit','jpDistance'].forEach(function(id){document.getElementById(id).addEventListener('change',draw);});var more=document.getElementById('jpMore');if(more)more.addEventListener('click',function(){DISPLAY_LIMIT+=DISPLAY_STEP;draw();});style();translate();"
          if marker not in s:
              raise SystemExit('build event marker not found')
          s=s.replace(marker,repl)

          old_slice="jobs.slice(0,60).map(function(j)"
          if old_slice not in s:
              raise SystemExit('fixed slice marker not found')
          s=s.replace(old_slice,"jobs.slice(0,DISPLAY_LIMIT).map(function(j)")

          marker2="var updated=(DATA.updatedAt||'').replace('T',' ').slice(0,16);document.getElementById('jpDate').textContent=updated?x.updated+': '+updated:'';}"
          repl2="var more=document.getElementById('jpMore');if(more){var remaining=Math.max(0,jobs.length-DISPLAY_LIMIT);more.style.display=remaining?'inline-block':'none';more.textContent=lang()==='sk'?'Zobraziť ďalšie ('+remaining+')':lang()==='en'?'Show more ('+remaining+')':'Показати ще ('+remaining+')';}var updated=(DATA.updatedAt||'').replace('T',' ').slice(0,16);document.getElementById('jpDate').textContent=updated?x.updated+': '+updated:'';}"
          if marker2 not in s:
              raise SystemExit('draw footer marker not found')
          s=s.replace(marker2,repl2)

          s=s.replace('standalone vacancies page v7','standalone vacancies page v8')
          p.write_text(s,encoding='utf-8')

          p=Path('analysis-enhancer-v2.js')
          s=p.read_text(encoding='utf-8')
          if "jobs-page.js?v=7" not in s:
              raise SystemExit('jobs loader v7 marker not found')
          p.write_text(s.replace("jobs-page.js?v=7","jobs-page.js?v=8"),encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check jobs-page.js
          node --check analysis-enhancer-v2.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-page.js analysis-enhancer-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Add responsive vacancy load more"
          git push
