name: One-time restore working analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-restore-working-analysis.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified analysis v2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="analysis-enhancer-v3.js?v=3"></script>'
          new='<script src="analysis-enhancer-v2.js?v=7"></script>'
          if old not in s:
              raise SystemExit('current v3 loader not found')
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one v3 loader, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate restored analysis
        run: |
          node --check analysis-enhancer-v2.js
          grep -q 'analysis-enhancer-v2.js?v=7' index.html
          ! grep -q 'analysis-enhancer-v3.js?v=3' index.html
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore verified vacancy analysis v2"
          git push
