name: JobAI My Resumes v3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[jobai-my-resumes-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='my-resumes-manager.js'
          if marker not in s:
              tag='\n<script src="my-resumes-manager.js"></script>\n'
              pos=s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('No closing body tag found')
              s=s[:pos]+tag+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Install My Resumes manager [jobai-my-resumes-v3]"
          git push
