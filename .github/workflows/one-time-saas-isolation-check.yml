name: One-time SaaS isolation check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-saas-isolation-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated SaaS prototype
        run: |
          node --check saas/account-prototype.js
          test -f saas/account.html
          test -f saas/supabase-schema.sql
          test -f saas/README.md
          ! grep -q 'saas/account' index.html
          ! grep -q 'account-prototype.js' index.html
          ! grep -Eq 'fetch\(|XMLHttpRequest|WebSocket|sendBeacon' saas/account-prototype.js
          grep -q 'Row Level Security' saas/README.md
          grep -q 'enable row level security' saas/supabase-schema.sql
          grep -q 'subscriptions_select_own' saas/supabase-schema.sql
