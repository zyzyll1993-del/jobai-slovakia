name: One-time lazy jobs integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-lazy-jobs.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make jobs catalog lazy and connect it safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('jobs-page.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("var DATA={jobs:[]};", "var DATA={jobs:[]},LOADED=false;")
          s=s.replace("style();translate();var cvCity=val('city');if(cvCity)document.getElementById('jpFrom').value=cvCity;load();}", "style();translate();var cvCity=val('city');if(cvCity)document.getElementById('jpFrom').value=cvCity;}")
          s=s.replace("function load(){fetch('jobs-data.json", "function load(){if(LOADED)return;LOADED=true;fetch('jobs-data.json")
          s=s.replace(".catch(function(){DATA={jobs:[]};draw();});}", ".catch(function(){LOADED=false;DATA={jobs:[]};draw();});}")
          s=s.replace("if(name==='jobs'){document.querySelectorAll('.tab')", "if(name==='jobs'){load();document.querySelectorAll('.tab')")
          p.write_text(s,encoding='utf-8')

          p=Path('analysis-enhancer-v2.js')
          s=p.read_text(encoding='utf-8')
          marker="  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hook);else hook();\n})();"
          replacement="""  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hook);else hook();
  function loadJobsCatalog(){if(document.getElementById('jobaiJobsPageScript'))return;var s=document.createElement('script');s.id='jobaiJobsPageScript';s.src='jobs-page.js?v=7';s.defer=true;document.head.appendChild(s);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadJobsCatalog);else loadJobsCatalog();
})();"""
          if marker not in s:
              raise SystemExit('analysis enhancer marker not found')
          s=s.replace(marker,replacement)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          if 'analysis-enhancer-v2.js?v=1' not in h:
              raise SystemExit('index cache marker not found')
          h=h.replace('analysis-enhancer-v2.js?v=1','analysis-enhancer-v2.js?v=2')
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-page.js analysis-enhancer-v2.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore vacancies with lazy loading"
          git push
