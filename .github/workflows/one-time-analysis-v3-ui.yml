name: One-time analysis v3 mobile labels polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-analysis-v3-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish structured analysis UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('analysis-enhancer-v3.js')
          s=p.read_text(encoding='utf-8')
          old="var mm=matchedMissing(details),found=document.getElementById('found'),missing=document.getElementById('missing'),rec=document.getElementById('recommendation');if(found)found.innerHTML=list(mm.good);if(missing)missing.innerHTML=list(mm.bad);if(rec)rec.textContent=details.score>=70?u.good:details.score>=40?u.partial:u.low;"
          new="var mm=matchedMissing(details),found=document.getElementById('found'),missing=document.getElementById('missing'),rec=document.getElementById('recommendation'),foundTitle=document.getElementById('foundSkillsTitle'),missingTitle=document.getElementById('missingSkillsTitle');if(foundTitle)foundTitle.textContent=lang()==='sk'?'Potvrdené požiadavky':lang()==='en'?'Confirmed requirements':'Підтверджені вимоги';if(missingTitle)missingTitle.textContent=lang()==='sk'?'Chýbajúce alebo nepotvrdené požiadavky':lang()==='en'?'Missing or unconfirmed requirements':'Відсутні або непідтверджені вимоги';if(found)found.innerHTML=list(mm.good);if(missing)missing.innerHTML=list(mm.bad);if(rec)rec.textContent=details.score>=70?u.good:details.score>=40?u.partial:u.low;"
          if old not in s:
              raise SystemExit('requirements heading marker not found')
          s=s.replace(old,new,1)
          old="var rows=details.parts.map(function(p){return '<div style=\"display:grid;grid-template-columns:minmax(120px,.8fr) 80px minmax(180px,2fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(127,127,127,.18)\"><strong>'+esc(p.label)+'</strong><span style=\"font-weight:800\">'+p.score+'%</span><span>'+esc(statusText(p))+'</span></div>';}).join('');"
          new="var rows=details.parts.map(function(p){return '<div style=\"display:grid;grid-template-columns:minmax(110px,1fr) 60px;gap:7px 10px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(127,127,127,.18)\"><strong>'+esc(p.label)+'</strong><span style=\"font-weight:800;text-align:right\">'+p.score+'%</span><span style=\"grid-column:1/-1;opacity:.9\">'+esc(statusText(p))+'</span></div>';}).join('');"
          if old not in s:
              raise SystemExit('mobile rows marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='analysis-enhancer-v3.js?v=1'
          new='analysis-enhancer-v3.js?v=2'
          if old not in s:
              raise SystemExit('analysis v3/v1 loader not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate polished analysis
        run: |
          node --check analysis-enhancer-v3.js
          grep -q 'analysis-enhancer-v3.js?v=2' index.html
          grep -q 'Підтверджені вимоги' analysis-enhancer-v3.js
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-enhancer-v3.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish structured vacancy analysis UI"
          git push
