name: One-time billing isolation smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-billing-isolation-smoke.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated billing layer
        run: |
          node --check saas/account-prototype.js
          test -f saas/functions/jobai-create-checkout/index.ts
          test -f saas/functions/jobai-customer-portal/index.ts
          grep -q "functions.invoke('jobai-create-checkout'" saas/account-prototype.js
          grep -q "functions.invoke('jobai-customer-portal'" saas/account-prototype.js
          grep -q 'analysis-enhancer-v2.js?v=7' index.html
          ! grep -q 'saas/account' index.html
          ! grep -q 'account-prototype.js' index.html
          ! grep -Eq 'sk_live_|sk_test_|SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|service_role' saas/account-prototype.js saas/account.html
          grep -q "Deno.env.get('STRIPE_SECRET_KEY')" saas/functions/jobai-create-checkout/index.ts
          grep -q "verify" /dev/null || true
