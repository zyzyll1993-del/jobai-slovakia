name: Install resume section toggles
on:
  push:
    paths:
      - 'resume-sections-toggle.js'
      - '.github/workflows/jobai-resume-sections-toggle.yml'
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="resume-sections-toggle.js?v=1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('Missing body marker')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Install collapsible resume sections'
          git push
