<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JobAI Slovakia</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f6fb;
color:#172033;
}

header{
background:#172033;
color:white;
text-align:center;
padding:25px 15px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
color:#cbd5e1;
}

.language{
margin-top:15px;
}

.language button{
width:auto;
display:inline-block;
padding:8px 12px;
margin:3px;
background:#334155;
}

.language button.active{
background:#2563eb;
}

nav{
background:white;
display:flex;
justify-content:center;
gap:8px;
padding:10px;
position:sticky;
top:0;
z-index:10;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

nav button{
width:auto;
margin:0;
padding:11px 15px;
background:#e8eefc;
color:#172033;
}

nav button.active{
background:#2563eb;
color:white;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.card{
background:white;
padding:22px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

label{
display:block;
font-weight:bold;
margin:15px 0 7px;
}

input,
textarea{
width:100%;
padding:13px;
border:1px solid #d5dce8;
border-radius:10px;
font-size:16px;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
border:0;
border-radius:11px;
padding:14px;
margin-top:12px;
width:100%;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button.secondary{
background:#172033;
}

button.danger{
background:#dc2626;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.experience{
border:1px solid #e2e8f0;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.cv-preview{
background:white;
padding:35px;
min-height:700px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.cv-name{
font-size:32px;
font-weight:bold;
}

.cv-position{
color:#2563eb;
font-size:19px;
margin-top:5px;
}

.cv-contact{
margin-top:15px;
color:#475569;
}

.cv-section{
margin-top:28px;
}

.cv-section h3{
border-bottom:2px solid #172033;
padding-bottom:7px;
}

.cv-experience{
margin-bottom:18px;
}

.score{
text-align:center;
font-size:55px;
font-weight:bold;
color:#2563eb;
margin:20px;
}

.progress{
height:14px;
background:#e5e7eb;
border-radius:10px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#2563eb;
transition:width 1s;
}

.skill{
display:inline-block;
background:#e8eefc;
padding:8px 11px;
margin:4px;
border-radius:8px;
}

.success{
background:#ecfdf5;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.warning{
background:#fff7ed;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.info{
background:#eff6ff;
padding:15px;
border-radius:12px;
margin-top:15px;
}

#analysisResult{
display:none;
}

@media(max-width:600px){

.row{
grid-template-columns:1fr;
}

.cv-preview{
padding:22px;
}

.cv-name{
font-size:25px;
}

nav{
overflow-x:auto;
justify-content:flex-start;
}

}

@media print{

body{
background:white;
}

body > header,
nav,
.container > .card,
#cv,
#jobs{
display:none !important;
}

#preview{
display:block !important;
}

.cv-preview{
box-shadow:none;
}

}

</style>

</head>


<body>


<header>

<h1>JobAI Slovakia 🇸🇰</h1>

<p id="subtitle">
Ваш помічник для пошуку роботи
</
